name: Bug report
description: Report a reproducible problem in PeriShift.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please report reproducible behavior. Do not include credentials or real recipient personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the demo state or API operation needed to reproduce it.
      placeholder: 1. Start a fresh demo…
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshot
      description: Remove tokens and personal data before sharing.
      render: text
    validations:
      required: false
