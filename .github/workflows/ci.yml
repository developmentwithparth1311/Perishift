name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Backend, contracts, and web build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: perishift
          POSTGRES_USER: perishift
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U perishift -d perishift"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://perishift:local-dev-only@127.0.0.1:5432/perishift
      PERISHIFT_TEST_DATABASE_URL: postgresql+psycopg://perishift:local-dev-only@127.0.0.1:5432/perishift
      JWT_SECRET: ci-only-secret
      DEMO_MODE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run integrated validation
        run: bash scripts/verify_integrated.sh
