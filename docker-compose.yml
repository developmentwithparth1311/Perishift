services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-perishift}
      POSTGRES_USER: ${POSTGRES_USER:-perishift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-perishift} -d ${POSTGRES_DB:-perishift}"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://perishift:local-dev-only@db:5432/perishift}
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://perishift:local-dev-only@db:5432/perishift}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-this-secret}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: ./backend
    command: ["python", "-m", "app.workers"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://perishift:local-dev-only@db:5432/perishift}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-change-this-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
volumes:
  postgres_data:
